<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marisa Parallax</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="seasons">
    <div class="window"></div>

    <section class=" view view1">
        <h5>Flowers bloom</h5>
        <div class="spring">
            <h2>It's springtime!</h2>
            <div class="flower1"> <img src="images/springflower.png" alt=""></div>
        </div>
    </section>

    <section class="view view2">
        <h5>Flowers thrive</h5>
        <div class="summer">
            <h1>Summer sun hits!</h1>
            <div class="flower2"> <img src="images/summerflower.png" alt=""></div>
        </div>
    </section>

    <section class="view view3">
        <h5>Flowers wilt</h5>
        <div class="fall">
            <h6>Fall leaves change!</h6>
            <div class="flower3"> <img src="images/fallflower.png" alt=""></div>
        </div>
    </section>

    <section class="view view4">
        <h5>Flowers die</h5>
        <div class="winter">
            <h3>Winter snow falls!</h3>
            <div class="flower4"> <img src="images/winterflower.png" alt=""></div>
        </div>

    </section>

    <h5>Seasons Changing</h5>

</body>
</html>
